        <h1>Atiku Northern Youth Vanguard (ANYV) — Official National Platform</h1>
        <p><strong>Motto:</strong> Youth • Unity • Leadership • Progress | <strong>Slogan:</strong> Organise. Mobilise. Lead.</p>
        <p>The Atiku Northern Youth Vanguard (ANYV) is the constitutional, grassroots youth mobilization platform across the 19 Northern Nigerian States and the Federal Capital Territory (FCT). We unite progressive young leaders, students, innovators, professionals, and community builders inspired by the vision of His Excellency Alhaji Atiku Abubakar, GCON (Wazirin Adamawa).</p>
        
        <h2>Official State Chapters &amp; Executive Leadership Directory</h2>
        <ul>
          <li><strong>Benue State Chapter (Makurdi):</strong> State Coordinator: Hon. Dr. Levi Aondohemba Orhii (Phone: 08035023507), State Secretary: Pius Monday. Covering 23 LGAs.</li>
          <li><strong>Bauchi State Chapter (Bauchi):</strong> State Coordinator: Hon. Babayo Musa (Phone: 08031844595), State Secretary: Zechariah Nehemiah (Phone: 08036398658). Covering 20 LGAs.</li>
          <li><strong>Katsina State Chapter (Katsina):</strong> State Coordinator: Halliru Ibrahim Sk (Phone: 08035337510), Assistant Coordinator: Abubakar Ibrahim Marke, State Secretary: Ahmad Abdulrazak Bakori. Covering 34 LGAs.</li>
          <li><strong>Zamfara State Chapter (Gusau):</strong> State Coordinator: Saifullahi Sule Sanda (Phone: 07079220159), Assistant Coordinator: Hidayatu Lawal, State Secretary: Samaila Sani Janbako. Covering 14 LGAs.</li>
          <li><strong>Jigawa State Chapter (Dutse):</strong> State Coordinator: Jamilu Yusuf Musa (Phone: +2349018710083), Deputy Coordinator: Rukayya Musa Muhammad, State Secretary: Hon. Sulaiman Uwaisu Idris (Kafin Hausa). Covering 27 LGAs.</li>
          <li><strong>Kwara State Chapter (Ilorin):</strong> State Coordinator: Smart Olaitan (Phone: 07068995671), Assistant Coordinator: Idris Usman Mohammed, State Secretary: Jejelola Abdulganiyu O. Covering 16 LGAs.</li>
          <li><strong>Kogi State Chapter (Lokoja):</strong> State Coordinator: Adam Ustaz Ubaidullah (Phone: 08140337306), Assistant Coordinator: Salihu Sumaiya, State Secretary: Zakari Idozi. Covering 21 LGAs.</li>
          <li><strong>Kaduna State Chapter (Kaduna):</strong> State Coordinator: Comrade Nasiru Abdulhamid, Deputy Coordinator: Gaddafi Adamu, State Secretary: Veronica James. Covering 23 LGAs.</li>
          <li><strong>Other Northern Chapters:</strong> Kano (44 LGAs), Sokoto (23 LGAs), Kebbi (21 LGAs), Plateau (17 LGAs), Niger (25 LGAs), Nasarawa (13 LGAs), Adamawa (21 LGAs), Taraba (16 LGAs), Borno (27 LGAs), Yobe (17 LGAs), Gombe (11 LGAs), and FCT Abuja (6 Area Councils).</li>
        </ul>

        <h2>Core Objectives &amp; Programs</h2>
        <p>1. Northern Youth Leadership Academy (NYLA) — Grassroots ethical governance training.</p>
        <p>2. Agro-Tech &amp; Enterprise Incubator Grants — Equipping youth entrepreneurs in sustainable agriculture.</p>
        <p>3. Civic Engagement &amp; Voter Education — Community mobilization, electoral integrity, and citizen action.</p>
        <p>4. Digital Empowerment &amp; Technology Fellowship — Bridging digital divides across Northern communities.</p>
        <p>Join the movement today at <a href="https://atikunorthernyouthvanguard.com/membership">https://atikunorthernyouthvanguard.com/membership</a> or contact national leadership at contact@atikunorthernyouthvanguard.com.</p>
